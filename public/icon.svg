<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#F7F4ED"/>
  <!-- Circular subtle border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#D9CBB7" stroke-width="2"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#A6AA99" stroke-width="0.75" stroke-dasharray="4,4"/>
  
  <!-- Stylized Silhouette & M monogram -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Elegant Haute Couture Silhouette Head & Neck -->
    <path d="M-6 -140 C-6 -148, 6 -148, 6 -140 C6 -132, 2 -124, 0 -118 C-2 -124, -6 -132, -6 -140 Z" fill="#242321"/>
    <!-- Chapeau / Coiffe haute -->
    <path d="M-28 -148 C-10 -160, 10 -160, 28 -148 C20 -154, -20 -154, -28 -148 Z" fill="#D9B8B3"/>
    
    <!-- Bust & Corset waist -->
    <path d="M0 -115 C-18 -108, -26 -85, -14 -60 C-10 -50, -8 -30, -7 -10 L7 -10 C8 -30, 10 -50, 14 -60 C26 -85, 18 -108, 0 -115 Z" fill="#242321"/>
    
    <!-- Grand Robe Corolle / Crinoline Panier Arc -->
    <path d="M-7 -10 C-35 25, -95 70, -110 115 C-70 120, 70 120, 110 115 C95 70, 35 25, 7 -10 Z" fill="none" stroke="#242321" stroke-width="3"/>
    
    <!-- Drapery lines -->
    <path d="M-4 0 C-20 40, -50 80, -60 116" fill="none" stroke="#D9B8B3" stroke-width="1.75"/>
    <path d="M4 0 C20 40, 50 80, 60 116" fill="none" stroke="#D9B8B3" stroke-width="1.75"/>
    <path d="M0 5 L0 118" fill="none" stroke="#A6AA99" stroke-width="1.25" stroke-dasharray="2,2"/>
    
    <!-- Letter M arch overlay in serif elegance -->
    <text x="0" y="152" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#242321" text-anchor="middle" letter-spacing="4">MODOR</text>
    <text x="0" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#77736D" text-anchor="middle" letter-spacing="3">MODE &amp; MÉMOIRE</text>
  </g>
</svg>
