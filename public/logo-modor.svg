<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242321"/>
      <stop offset="100%" stop-color="#3A3835"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(15, 12)">
    <rect width="76" height="76" rx="18" fill="url(#logoGrad)" />
    <!-- Architectural corset & silhouette curve -->
    <path d="M38 18 C33 28, 28 35, 29 44 C31 46, 36 47, 38 47 C40 47, 45 46, 47 44 C48 35, 43 28, 38 18 Z" fill="none" stroke="#F7F4ED" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M29 44 C22 55, 17 64, 16 68 C24 71, 52 71, 60 68 C59 64, 54 55, 47 44" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="20" r="3" fill="#F7F4ED"/>
    <!-- Monogram M -->
    <text x="38" y="62" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" fill="#F7F4ED" text-anchor="middle">M</text>
  </g>

  <!-- Typography -->
  <g transform="translate(108, 22)">
    <text x="0" y="38" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#242321" letter-spacing="1">Modor</text>
    <text x="145" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#9A3412" letter-spacing="3">1500–2026</text>
    <text x="2" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#77736D" letter-spacing="2.5">MODE &amp; MÉMOIRE • FRANCE</text>
  </g>
</svg>
